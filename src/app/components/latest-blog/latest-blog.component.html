<section style="padding: 60px 0; background: #ffffff;">
      <div class="page-width" style="max-width: 1400px; margin: 0 auto; padding: 0 15px;">
        
        <div style="text-align: center; margin-bottom: 40px;">
          <span style="color: #e9611e; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 1px;">Industry News & Guides</span>
          <h2 style="font-size: 32px; font-weight: 800; color: #232f3e; margin: 6px 0;">Latest From Toolgard Journal</h2>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px;">
          <article *ngFor="let blog of productService.blogs()" style="border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.03);">
            
            <div style="height: 200px; overflow: hidden; position: relative;">
              <img [src]="blog.image" [alt]="blog.title" style="width: 100%; height: 100%; object-fit: cover;">
              <span style="position: absolute; bottom: 12px; left: 12px; background: #232f3e; color: #fff; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 3px;">
                {{ blog.date }}
              </span>
            </div>

            <div style="padding: 22px;">
              <div style="font-size: 12px; color: #64748b; font-weight: 600; margin-bottom: 8px; display: flex; gap: 15px;">
                <span><i class="fa fa-user" style="color: #e9611e;"></i> {{ blog.author }}</span>
                <span><i class="fa fa-comments" style="color: #e9611e;"></i> {{ blog.commentsCount }} Comments</span>
              </div>

              <h3 style="font-size: 18px; font-weight: 700; color: #1e293b; margin: 0 0 10px 0; line-height: 1.4;">
                {{ blog.title }}
              </h3>

              <p style="font-size: 14px; color: #64748b; line-height: 1.6; margin-bottom: 18px;">
                {{ blog.excerpt }}
              </p>

              <a href="javascript:void(0)" style="color: #e9611e; font-weight: 700; text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 6px;">
                Read Full Article <i class="fa fa-arrow-right"></i>
              </a>
            </div>

          </article>
        </div>

      </div>
    </section>
