<nav class="mobile-bottom-dock">
  <!-- Home button -->
  <button class="dock-item" (click)="scrollToTop()">
    <i class="fa fa-home"></i>
    <span>Home</span>
  </button>

  <!-- Categories button -->
  <button class="dock-item" (click)="mobileNavService.openDrawer()">
    <i class="fa fa-bars"></i>
    <span>Categories</span>
  </button>

  <!-- Deals button -->
  <button class="dock-item" (click)="scrollToSection('MainContent')">
    <i class="fa fa-tag"></i>
    <span>Deals</span>
  </button>

  <!-- Cart button with badge -->
  <button class="dock-item cart-item" (click)="cartService.toggleCart()">
    <div class="icon-wrap">
      <i class="fa fa-shopping-bag"></i>
      <span class="badge" *ngIf="cartService.totalCount() > 0">{{ cartService.totalCount() }}</span>
    </div>
    <span>Cart</span>
  </button>

  <!-- Account button -->
  <button class="dock-item">
    <i class="fa fa-user-o"></i>
    <span>Account</span>
  </button>
</nav>
