<div class="modal-overlay" [class.active]="quickViewService.isOpen()" (click)="quickViewService.closeQuickView()">
      
      <div class="modal-content" (click)="$event.stopPropagation()" *ngIf="quickViewService.activeProduct() as product">
        <button class="modal-close" (click)="quickViewService.closeQuickView()">&times;</button>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; align-items: center;">
          
          <!-- Image -->
          <div style="background: #f8f9fa; border-radius: 8px; padding: 20px; text-align: center;">
            <img [src]="product.image" [alt]="product.title" style="max-width: 100%; max-height: 300px; object-fit: contain;">
          </div>

          <!-- Product info -->
          <div>
            <span style="color: #e9611e; font-weight: 700; font-size: 12px; text-transform: uppercase;">{{ product.vendor }} • {{ product.type }}</span>
            <h2 style="font-size: 24px; font-weight: 800; color: #232f3e; margin: 8px 0 15px 0;">
              {{ product.title }}
            </h2>

            <div style="font-size: 28px; font-weight: 800; color: #e9611e; margin-bottom: 15px;">
              \${{ product.price.toFixed(2) }}
              <span *ngIf="product.originalPrice" style="font-size: 16px; color: #94a3b8; text-decoration: line-through; margin-left: 10px;">\${{ product.originalPrice.toFixed(2) }}</span>
            </div>

            <p style="font-size: 14px; color: #64748b; line-height: 1.6; margin-bottom: 20px;">
              {{ product.description }}
            </p>

            <div style="font-size: 13px; color: #334155; margin-bottom: 20px; line-height: 1.8;">
              <div><strong>SKU:</strong> {{ product.sku }}</div>
              <div><strong>Availability:</strong> <span style="color: #10b981; font-weight: 700;">In Stock (Ready to Ship)</span></div>
            </div>

            <!-- Quantity & Add -->
            <div style="display: flex; gap: 15px; align-items: center;">
              <div style="display: flex; align-items: center; border: 1px solid #cbd5e1; border-radius: 4px; overflow: hidden;">
                <button (click)="decreaseQty()" style="padding: 10px 14px; background: #f1f5f9; border: none; cursor: pointer;">-</button>
                <span style="padding: 10px 16px; font-weight: 700;">{{ quantity() }}</span>
                <button (click)="increaseQty()" style="padding: 10px 14px; background: #f1f5f9; border: none; cursor: pointer;">+</button>
              </div>

              <button (click)="addToCart(product)" style="flex: 1; background: #e9611e; color: #fff; border: none; padding: 12px 24px; font-size: 15px; font-weight: 700; border-radius: 4px; cursor: pointer; text-transform: uppercase;">
                Add To Cart
              </button>
            </div>

          </div>

        </div>

      </div>

    </div>
