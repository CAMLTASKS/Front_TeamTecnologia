<!-- Preloader -->
<app-loading-overlay></app-loading-overlay>

<ng-container *ngIf="!isAuthRoute">
  <!-- Mobile Navigation Drawer -->
  <app-mobile-drawer></app-mobile-drawer>

  <!-- Header & Top Navigation -->
  <app-header></app-header>
</ng-container>

<!-- Router Outlet Body -->
<main class="main-content" id="MainContent" role="main" [class.auth-layout]="isAuthRoute">
  <router-outlet></router-outlet>
</main>

<ng-container *ngIf="!isAuthRoute">
  <!-- Footer -->
  <app-footer></app-footer>

  <!-- Interactive Slide-over Cart -->
  <app-cart-drawer></app-cart-drawer>

  <!-- Mobile Navigation Dock -->
  <app-mobile-nav-dock></app-mobile-nav-dock>
</ng-container>

<!-- Quick View Popup Modal -->
<app-quick-view-modal></app-quick-view-modal>

<!-- Bottom Cookie Consent -->
<app-cookie-banner></app-cookie-banner>

<!-- Bottom-Left Purchase Toast Notification -->
<app-notification-toast></app-notification-toast>
