<!-- Top Deep Blue Header Bar -->
<div class="header-dark-bar">
  <div class="header-dark-inner">
    
    <!-- Mobile Hamburger & Logo Group (Left) -->
    <div class="mobile-logo-group">
      <button class="mobile-hamburger-btn" (click)="mobileNavService.toggleDrawer()">
        <i class="fa fa-bars"></i>
      </button>

      <!-- TeamTecnologia Logo & Brand Title -->
      <a routerLink="/" class="brand-logo-link">
        <img src="/assets/logo.png" alt="TeamTecnologia" class="brand-logo-img" (error)="$any($event.target).style.display='none'">
        <span class="brand-logo-text">Team<span class="brand-red-text">Tecnologia</span></span>
      </a>
    </div>

    <!-- Desktop Search Bar -->
    <div class="header-search-container desktop-only-search" (click)="openSearchModal()">
      <input type="text" placeholder="Buscar teclados, portátiles, accesorios, celulares..." class="header-search-input" readonly>
      <button type="button" class="header-search-btn">
        <i class="fa fa-search" style="margin-right: 6px;"></i> BUSCAR
      </button>
    </div>

    <!-- Right Side Icons & Actions -->
    <div class="header-icons-row">
      
      <!-- Mobile Search Trigger -->
      <button class="mobile-search-trigger-btn" (click)="openSearchModal()" title="Buscar">
        <i class="fa fa-search"></i>
      </button>

      <!-- Soporte ERP -->
      <div class="desktop-only-info" style="display: flex; flex-direction: column; line-height: 1.3;">
        <span style="font-size: 11px; color: #94a3b8;">Línea de Atención ERP</span>
        <span style="font-weight: 700; color: #ffffff; font-size: 13px;">(+57) 601 555-8899</span>
      </div>

      <!-- Mi Cuenta -->
      <div class="desktop-only-info" style="display: flex; flex-direction: column; line-height: 1.3; cursor: pointer;">
        <span style="font-size: 11px; color: #94a3b8;">Portal Clientes</span>
        <span style="font-weight: 600; color: #ffffff; font-size: 13px;">Iniciar Sesión</span>
      </div>

      <!-- Comparar -->
      <a href="javascript:void(0)" title="Comparar" class="icon-bubble desktop-only-icon">
        <div class="icon-circle">
          <i class="fa fa-sliders"></i>
        </div>
        <span class="icon-badge">0</span>
      </a>

      <!-- Deseos -->
      <a href="javascript:void(0)" title="Favoritos" class="icon-bubble desktop-only-icon">
        <div class="icon-circle">
          <i class="fa fa-heart-o"></i>
        </div>
        <span class="icon-badge">0</span>
      </a>

      <!-- Carrito ERP -->
      <a href="javascript:void(0)" (click)="cartService.toggleCart()" title="Carrito" class="icon-bubble">
        <div class="icon-circle">
          <i class="fa fa-shopping-bag"></i>
        </div>
        <span class="icon-badge">{{ cartService.totalCount() }}</span>
      </a>

    </div>

  </div>
</div>

<!-- Interactive Top Search Modal Overlay -->
<div class="search-modal-backdrop" [class.active]="showSearchModal()" (click)="closeSearchModal()"></div>
<div class="search-modal-panel" [class.open]="showSearchModal()">
  <div class="search-modal-inner">
    <div class="search-modal-header">
      <div class="search-input-wrap">
        <i class="fa fa-search search-icon"></i>
        <input type="text" 
               [value]="searchQuery()" 
               (input)="searchQuery.set($any($event.target).value)" 
               placeholder="Buscar teclados, portátiles, hubs USB-C, accesorios..." 
               class="modal-search-input"
               #searchInput>
        <button *ngIf="searchQuery()" (click)="clearSearch()" class="clear-btn">&times;</button>
      </div>
      <button class="search-close-btn" (click)="closeSearchModal()">&times;</button>
    </div>

    <!-- Quick Suggestions -->
    <div class="search-modal-body">
      <div class="quick-title">Búsquedas Frecuentes TeamTecnologia</div>
      <div class="quick-tags">
        <span *ngFor="let tag of quickTags" (click)="selectTag(tag)" class="tag-chip">
          <i class="fa fa-fire"></i> {{ tag }}
        </span>
      </div>
    </div>
  </div>
</div>

<!-- White Navigation & Category Bar -->
<div class="header-bottom-bar">
  <div class="header-bottom-inner">
    
    <!-- Browse All Category Dropdown -->
    <div style="position: relative;">
      <button (click)="toggleCategory()" class="browse-cat-btn">
        <i class="fa fa-bars" style="color: var(--color-primary, #d90429); font-size: 15px;"></i>
        <span>Accesorios & Tecnología</span>
        <i class="fa fa-chevron-down" style="font-size: 10px; color: #64748b;"></i>
      </button>

      <div *ngIf="showCategory()" class="cat-dropdown-menu">
        <ul>
          <ng-container *ngFor="let cat of categoryService.categories()">
            <li class="parent-cat-header">
              <i class="fa fa-folder-open" style="color: var(--color-primary, #d90429); margin-right: 6px;"></i>
              <strong>{{ cat.name }}</strong>
            </li>
            <li *ngFor="let sub of cat.subcategories" class="sub-cat-item" routerLink="/catalogo">
              <span style="color: #94a3b8; margin-right: 6px;">↳</span> {{ sub.name }}
            </li>
          </ng-container>
        </ul>
      </div>
    </div>

    <!-- Inline Navigation Links with RouterLink -->
    <nav class="desktop-nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Inicio</a>
      <a routerLink="/catalogo" routerLinkActive="active">Catálogo ERP</a>
      <a routerLink="/nosotros" routerLinkActive="active">Nosotros</a>
      <a routerLink="/contacto" routerLinkActive="active">Contacto (Casos)</a>
      <a routerLink="/blog" routerLinkActive="active">Blog (Base Conocimiento)</a>
    </nav>

    <!-- Currency & Language Dropdowns -->
    <div class="desktop-currency-lang">
      <span>COP $ <i class="fa fa-chevron-down" style="font-size: 9px; margin-left: 3px;"></i></span>
      <span>Español <i class="fa fa-chevron-down" style="font-size: 9px; margin-left: 3px;"></i></span>
    </div>

  </div>
</div>
