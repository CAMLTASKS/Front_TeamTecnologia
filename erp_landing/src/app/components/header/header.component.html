<!-- Top Dark Navy Header Bar -->
<div class="header-dark-bar">
  <div class="header-dark-inner">
    
    <!-- Mobile Hamburger & Logo Group (Left) -->
    <div class="mobile-logo-group">
      <button class="mobile-hamburger-btn" (click)="mobileNavService.toggleDrawer()">
        <i class="fa fa-bars"></i>
      </button>

      <!-- Toolgard Logo -->
      <a href="/" class="brand-logo-link">
        <img src="/cdn/shop/files/logo_200x.png" alt="Toolgard" class="brand-logo-img">
      </a>
    </div>

    <!-- Desktop Search Bar (Triggers Interactive Search Modal) -->
    <div class="header-search-container desktop-only-search" (click)="openSearchModal()">
      <input type="text" placeholder="Search tools, equipment, brands..." class="header-search-input" readonly>
      <button type="button" class="header-search-btn">
        <i class="fa fa-search" style="margin-right: 6px;"></i> SEARCH
      </button>
    </div>

    <!-- Right Side Icons & Actions -->
    <div class="header-icons-row">
      
      <!-- Mobile Search Trigger Icon Button -->
      <button class="mobile-search-trigger-btn" (click)="openSearchModal()" title="Search">
        <i class="fa fa-search"></i>
      </button>

      <!-- Need Help -->
      <div class="desktop-only-info" style="display: flex; flex-direction: column; line-height: 1.3;">
        <span style="font-size: 11px; color: #94a3b8;">Necesita ayuda?</span>
        <span style="font-weight: 700; color: #ffffff; font-size: 13px;">(+91) 0123-456-789</span>
      </div>

      <!-- My Account -->
      <div class="desktop-only-info" style="display: flex; flex-direction: column; line-height: 1.3; cursor: pointer;">
        <span style="font-size: 11px; color: #94a3b8;">My Account</span>
        <span style="font-weight: 600; color: #ffffff; font-size: 13px;">Log in / Register</span>
      </div>

      <!-- Compare Icon Bubble -->
      <a href="javascript:void(0)" title="Compare" class="icon-bubble desktop-only-icon">
        <div class="icon-circle">
          <i class="fa fa-sliders"></i>
        </div>
        <span class="icon-badge">0</span>
      </a>

      <!-- Wishlist Icon Bubble -->
      <a href="javascript:void(0)" title="Wishlist" class="icon-bubble desktop-only-icon">
        <div class="icon-circle">
          <i class="fa fa-heart-o"></i>
        </div>
        <span class="icon-badge">0</span>
      </a>

      <!-- Cart Icon Bubble -->
      <a href="javascript:void(0)" (click)="cartService.toggleCart()" title="Cart" class="icon-bubble">
        <div class="icon-circle">
          <i class="fa fa-shopping-bag"></i>
        </div>
        <span class="icon-badge">{{ cartService.totalCount() }}</span>
      </a>

    </div>

  </div>
</div>

<!-- Interactive Top Search Modal Overlay (Desktop & Mobile) -->
<div class="search-modal-backdrop" [class.active]="showSearchModal()" (click)="closeSearchModal()"></div>
<div class="search-modal-panel" [class.open]="showSearchModal()">
  <div class="search-modal-inner">
    <div class="search-modal-header">
      <div class="search-input-wrap">
        <i class="fa fa-search search-icon"></i>
        <input type="text" 
               [value]="searchQuery()" 
               (input)="searchQuery.set($any($event.target).value)" 
               placeholder="Search tools, equipment, brands..." 
               class="modal-search-input"
               #searchInput>
        <button *ngIf="searchQuery()" (click)="clearSearch()" class="clear-btn">&times;</button>
      </div>
      <button class="search-close-btn" (click)="closeSearchModal()">&times;</button>
    </div>

    <!-- Quick Suggestions -->
    <div class="search-modal-body">
      <div class="quick-title">Popular Searches</div>
      <div class="quick-tags">
        <span *ngFor="let tag of quickTags" (click)="selectTag(tag)" class="tag-chip">
          <i class="fa fa-fire"></i> {{ tag }}
        </span>
      </div>
    </div>
  </div>
</div>

<!-- White Navigation & Category Bar -->
<div class="header-bottom-bar">
  <div class="header-bottom-inner">
    
    <!-- Browse All Category Dropdown -->
    <div style="position: relative;">
      <button (click)="toggleCategory()" class="browse-cat-btn">
        <i class="fa fa-bars" style="color: var(--color-primary, #e9611e); font-size: 15px;"></i>
        <span>Browse All Category</span>
        <i class="fa fa-chevron-down" style="font-size: 10px; color: #64748b;"></i>
      </button>

      <div *ngIf="showCategory()" class="cat-dropdown-menu">
        <ul>
          <ng-container *ngFor="let cat of categoryService.categories()">
            <li class="parent-cat-header">
              <i class="fa fa-folder-open" style="color: #e9611e; margin-right: 6px;"></i>
              <strong>{{ cat.name }}</strong>
            </li>
            <li *ngFor="let sub of cat.subcategories" class="sub-cat-item">
              <span style="color: #94a3b8; margin-right: 6px;">↳</span> {{ sub.name }}
            </li>
          </ng-container>
        </ul>
      </div>
    </div>

    <!-- Inline Navigation Links -->
    <nav class="desktop-nav-links">
      <a href="javascript:void(0)" class="active">Home</a>
      <a href="javascript:void(0)">Catalog</a>
      <a href="javascript:void(0)">Tools</a>
      <a href="javascript:void(0)">About Us</a>
      <a href="javascript:void(0)">Blog</a>
      <a href="javascript:void(0)">Contact</a>
    </nav>

    <!-- Currency & Language Dropdowns -->
    <div class="desktop-currency-lang">
      <span>USD $ <i class="fa fa-chevron-down" style="font-size: 9px; margin-left: 3px;"></i></span>
      <span>English <i class="fa fa-chevron-down" style="font-size: 9px; margin-left: 3px;"></i></span>
    </div>

  </div>
</div>
