<nav class="mobile-bottom-dock">
  <!-- Home button -->
  <button class="dock-item" [class.active]="activeTab === 'home'" (click)="selectTab('home'); scrollToTop()">
    <i class="fa fa-home"></i>
    <span>Home</span>
    <div class="active-dot"></div>
  </button>

  <!-- Categories button -->
  <button class="dock-item" [class.active]="activeTab === 'categories'" (click)="selectTab('categories'); mobileNavService.openDrawer()">
    <i class="fa fa-th-large"></i>
    <span>Categories</span>
    <div class="active-dot"></div>
  </button>

  <!-- Deals button -->
  <button class="dock-item" [class.active]="activeTab === 'deals'" (click)="selectTab('deals'); scrollToSection('MainContent')">
    <i class="fa fa-bolt"></i>
    <span>Deals</span>
    <div class="active-dot"></div>
  </button>

  <!-- Cart button with badge -->
  <button class="dock-item cart-item" [class.active]="activeTab === 'cart'" (click)="selectTab('cart'); cartService.toggleCart()">
    <div class="icon-wrap">
      <i class="fa fa-shopping-bag"></i>
      <span class="badge" *ngIf="cartService.totalCount() > 0">{{ cartService.totalCount() }}</span>
    </div>
    <span>Cart</span>
    <div class="active-dot"></div>
  </button>

  <!-- Account button -->
  <button class="dock-item" [class.active]="activeTab === 'account'" (click)="selectTab('account')">
    <i class="fa fa-user-o"></i>
    <span>Account</span>
    <div class="active-dot"></div>
  </button>
</nav>
