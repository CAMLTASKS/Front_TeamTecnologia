<nav class="mobile-bottom-dock">

  <!-- Home -->
  <button class="dock-item" [class.active]="activeTab === 'home'" 
          (click)="selectTab('home'); scrollToTop()" routerLink="/">
    <i class="fa fa-home"></i>
    <span>Inicio</span>
    <div class="active-dot"></div>
  </button>

  <!-- Catálogo -->
  <button class="dock-item" [class.active]="activeTab === 'catalogo'"
          (click)="selectTab('catalogo')" routerLink="/catalogo">
    <i class="fa fa-th-large"></i>
    <span>Catálogo</span>
    <div class="active-dot"></div>
  </button>

  <!-- Cart with badge -->
  <button class="dock-item dock-cart" [class.active]="activeTab === 'cart'"
          (click)="selectTab('cart'); cartService.toggleCart()">
    <div class="dock-cart-bubble">
      <i class="fa fa-shopping-bag"></i>
      <span class="dock-badge" *ngIf="cartService.totalCount() > 0">{{ cartService.totalCount() }}</span>
    </div>
    <span>Carrito</span>
    <div class="active-dot"></div>
  </button>

  <!-- Favoritos -->
  <button class="dock-item" [class.active]="activeTab === 'favoritos'"
          (click)="selectTab('favoritos')" routerLink="/mi-cuenta">
    <div style="position:relative; display:inline-flex;">
      <i class="fa fa-heart-o"></i>
      <span class="dock-badge-sm" *ngIf="wishlistService.totalCount() > 0">{{ wishlistService.totalCount() }}</span>
    </div>
    <span>Favoritos</span>
    <div class="active-dot"></div>
  </button>

  <!-- Account / Login -->
  <button class="dock-item" [class.active]="activeTab === 'account'"
          (click)="goToAccount()">
    <ng-container *ngIf="authService.isLoggedIn()">
      <div class="dock-avatar">{{ authService.getInitials() }}</div>
    </ng-container>
    <ng-container *ngIf="!authService.isLoggedIn()">
      <i class="fa fa-user-o"></i>
    </ng-container>
    <span>{{ authService.isLoggedIn() ? 'Mi Cuenta' : 'Ingresar' }}</span>
    <div class="active-dot"></div>
  </button>

</nav>
