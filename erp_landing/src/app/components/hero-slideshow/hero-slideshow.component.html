<div class="slideshow-wrapper">
  
  <!-- Slide Items -->
  <div *ngFor="let slide of slides; let i = index" 
       class="slide-item"
       [class.active-slide]="currentSlide() === i">
    
    <img [src]="slide.image" [alt]="slide.title" class="slide-bg-image">

    <!-- Slide Content Glass Card -->
    <div class="slide-overlay-container">
      <div class="slide-glass-card">
        <span class="slide-badge">
          <i class="fa fa-bolt" style="margin-right: 6px;"></i> {{ slide.subtitle }}
        </span>

        <h2 class="slide-main-title">
          {{ slide.title }}
        </h2>

        <p class="slide-description">
          {{ slide.description }}
        </p>

        <div class="slide-actions-row">
          <a href="#catalog-section" class="btn-primary-action">
            EXPLORAR CATÁLOGO <i class="fa fa-arrow-right" style="margin-left: 8px;"></i>
          </a>
          <a href="javascript:void(0)" class="btn-secondary-action">
            HASTA 50% DESCUENTO
          </a>
        </div>
      </div>
    </div>

  </div>

  <!-- Previous Button -->
  <button (click)="prevSlide()" class="carousel-control-btn prev-btn" title="Anterior">
    <i class="fa fa-angle-left"></i>
  </button>

  <!-- Next Button -->
  <button (click)="nextSlide()" class="carousel-control-btn next-btn" title="Siguiente">
    <i class="fa fa-angle-right"></i>
  </button>

  <!-- Indicator Dots -->
  <div class="carousel-indicators-bar">
    <span *ngFor="let s of slides; let i = index" 
          (click)="setSlide(i)"
          class="indicator-dot"
          [class.active-dot]="currentSlide() === i">
    </span>
  </div>

</div>
